name: quality
on: [push, pull_request]
jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PROVIDER: mock
      INTEGRATIONS: simulated
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q --cov=agentflow --cov=ui --cov-report=term-missing --cov-report=xml
      - run: ruff check .
      - run: python scripts/offline_smoke.py
      - run: python -m agentflow.eval.run --dataset fixtures/eval_cases.jsonl --output reports/eval.json
      - uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}-${{ matrix.python }}
          path: |
            reports/*.json
            reports/*.md
            coverage.xml

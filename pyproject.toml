[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow-mcp"
version = "0.1.0"
description = "Offline workflow copilot with official MCP and simulated enterprise adapters"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3", "fastapi>=0.121,<1", "uvicorn>=0.31,<1", "httpx>=0.28,<1", "mcp>=1.28,<2", "streamlit>=1.40,<2", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]
ollama = ["httpx>=0.28,<1"]

[project.scripts]
agentflow = "agentflow.cli:main"
agentflow-mcp = "agentflow.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentflow = ["data/*.json", "data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["reports", "build", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
